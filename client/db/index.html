<!DOCTYPE html><html lang="en"><head>
    <title>NSB Reader - Database</title>
    <!--#include virtual="/ssi/head.html" -->
    <meta name="description" content="Search through the database that powers NSB Reader.">
</head>

<body>
    <!--#include virtual="/ssi/nav.html" -->

    <div class="container-xl mt-3 mb-4">
        <!--#include virtual="/ssi/star-toast.html" -->
        <div class="row">
            <div class="col-12">
                <p class="lead">
                    Search the database that powers NSB Reader.
                </p>
                <p>
                    To copy a question to the clipboard, click on the left side of the header.
                    To collapse a question, click on the right side of the header.
                </p>
                <div id="root"></div>
            </div>
        </div>
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="clipboard-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <strong class="me-auto">Question copied to clipboard.</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>

    <!--#include virtual="/ssi/report-question-modal.html" -->

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
    <script type="module" src="./index.min.js"></script>



</body></html>
