<!doctype html>
<html lang="en">

<head>
    <title>NSB Reader - Play - All Questions</title>
    <!--#include virtual="/ssi/head.html" -->
    <meta name="description" content="Practice NSB questions in NSB format: tossup followed by bonus.">
</head>

<body>
    <!--#include virtual="/ssi/nav.html" -->

    <div class="container-fluid mt-3 mb-5 pb-5 px-xxl-5">
        <!--#include virtual="/ssi/star-toast.html" -->
        <!--#include virtual="/ssi/funny-toast.html" -->
        <div class="row" id="info">
            <div class="options d-lg-block col-12 col-lg-3 order-lg-1 mb-5" id="settings">
                <div class="timer d-block p-1 text-center d-none" id="timer">
                    <span class="face">0</span><span class="fraction">.0</span>
                </div>
                <hr>
                <label class="form-check-label mb-1" for="set-mode">Choose a mode:</label>
                <select class="form-select mb-2" id="set-mode">
                    <option value="random questions" selected>Random Questions</option>
                    <option value="select by set name">Select by Set Name</option>
                </select>
                <div class="d-none" id="set-settings">
                    <input class="form-control" id="set-name" type="text" placeholder="Set Name" list="set-list">
                    <datalist id="set-list"></datalist>
                    <input class="form-control my-1" id="packet-number" type="text" placeholder="Packet Numbers">
                </div>
                <div id="difficulty-settings">
                    Year range: <span id="min-year-label"></span> - <span id="max-year-label"></span>
                    <div class="ui-slider d-flex align-items-center" id="year-slider">
                        <span class="ui-slider-handle" id="min-year-handle"></span>
                        <span class="ui-slider-handle" id="max-year-handle"></span>
                    </div>
                </div>
                <div class="mt-2" id="general-settings">
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="always-show-bonuses" type="checkbox" checked>
                        <label class="form-check-label" for="always-show-bonuses">Show bonus after a missed tossup</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="toggle-timer" type="checkbox" checked>
                        <label class="form-check-label" for="toggle-timer">Timer</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="toggle-show-history" type="checkbox" checked>
                        <label class="form-check-label" for="toggle-show-history">Show history</label>
                    </div>
                    <div hidden>
                        <input id="toggle-enable-bonuses" type="checkbox" checked>
                        <input id="toggle-standard-only" type="checkbox">
                        <input id="toggle-rebuzz" type="checkbox">
                        <input id="toggle-stop-on-power" type="checkbox">
                        <input id="toggle-three-part-bonuses" type="checkbox">
                    </div>
                    <div class="text-center mb-2">
                        <button class="btn btn-danger" id="category-select-button" data-bs-target="#category-modal"
                            data-bs-toggle="modal" type="button">Categories</button>
                        <button class="btn btn-warning" id="clear-stats" type="button">Clear Stats</button>
                    </div>
                    <hr>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="type-to-answer" type="checkbox" role="switch" checked>
                        <label class="form-check-label" for="type-to-answer">Type to answer</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="toggle-show-set-name" type="checkbox" role="switch" checked>
                        <label class="form-check-label" for="toggle-show-set-name">Show set name</label>
                    </div>
                    <div class="mb-2"></div>
                    <label for="reading-speed">Reading speed: <span id="reading-speed-display">35</span><br></label>
                    <input class="form-range" id="reading-speed" type="range" min="0" max="100" step="5" value="35">
                    <label for="set-strictness">Strictness: <span id="strictness-display">7</span><br></label>
                    <input class="form-range" id="set-strictness" type="range" min="0" max="20" step="1" value="7">
                    <div>View more settings <a href="/settings/">here</a>.</div>
                    <div class="d-none d-lg-block">
                        <hr>
                        <p>
                            <span class="text-nowrap"><kbd>spacebar</kbd> = buzz / reveal</span><br>
                            <span class="text-nowrap"><kbd>n</kbd> = next</span><br>
                            <span class="text-nowrap"><kbd>e</kbd> = toggle settings</span><br>
                            <span class="text-nowrap"><kbd>k</kbd> = show/hide last question</span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-9" id="content">
                <form id="answer-form">
                    <div class="input-group d-none my-2" id="answer-input-group">
                        <input class="form-control" id="answer-input" type="text" placeholder="Enter answer" autocomplete="off">
                        <button class="btn btn-success" id="answer-submit" type="submit">Submit</button>
                    </div>
                </form>
                <div class="d-flex justify-content-between flex-wrap gap-1">
                    <div>
                        <span id="tossup-statline">0/0/0 with 0 tossups seen (0 pts, celerity: 0.000)</span><br>
                        <span id="bonus-statline">0/0 bonuses correct (0 pts)</span>
                    </div>
                    <span class="ps-5 me-lg-2" id="question-metadata">
                        <b id="question-info">
                            <span id="set-name-info"></span>
                            Packet <span id="packet-number-info">-</span><span class="d-none placeholder">-</span>
                            Question <span id="question-number-info">-</span><span class="d-none placeholder">-</span>
                            of <span id="packet-length-info">-</span><span class="d-none placeholder">-</span>
                        </b>
                        <span id="question-meta-info" class="ms-2 text-muted fw-normal"></span>
                    </span>
                </div>
                <div class="mt-2" id="question"></div>
                <p class="mt-1 mt-lg-3 mb-0" id="answer"></p>
                <p class="d-none small text-muted mb-2" id="answer-feedback">
                    <span id="correctness-label"></span>
                    &middot; <a href="#" class="link-secondary" id="toggle-correctness"></a>
                </p>
                <ul class="room-history list-unstyled" id="room-history"></ul>
            </div>
        </div>
    </div>

    <div class="container-fluid py-3 px-xxl-5 position-fixed bottom-0 bg-body">
        <div class="row">
            <div class="col-12 col-lg-9" id="buttons">
                <button class="btn btn-primary" id="next" type="button"
                    title="Shortcut: n key">Next</button>
                <button class="btn btn-primary d-none" id="pause" type="button">
                    <i class="bi bi-pause-fill"></i></button>
                <button class="btn btn-danger" id="toggle-settings" type="button" title="Shortcut: e key">
                    <div class="d-flex align-items-center"><i class="bi bi-gear"></i></div>
                </button>
                <button class="btn btn-primary float-end" id="buzz" type="button"
                    title="Shortcut: spacebar" disabled>Buzz</button>
                <button class="btn btn-primary float-end d-none me-1" id="reveal" type="button"
                    title="Shortcut: spacebar" disabled>Buzz</button>
            </div>
        </div>
    </div>

    <div id="category-modal-root"></div>
    <!--#include virtual="/ssi/report-question-modal.html" -->

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
        integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"
        integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
    <script type="module" src="./index.min.js"></script>
</body>

</html>
