<!DOCTYPE html><html lang="en"><head>
    <title>NSB Reader - Play - Multiplayer</title>
    <!--#include virtual="/ssi/head.html" -->
</head>

<body>
    <!--#include virtual="/ssi/nav.html" -->

    <div class="container mt-3 mb-4">
        <p class="lead">Play science bowl real-time against other players.</p>
        <p>
            You can invite friends to join you by sharing the URL to your room.
        </p>
        <p>
            The room creator controls settings and question advancement.
        </p>
        <p class="mb-0 pb-2">Create/Join a Room:</p>
        <form id="form">
            <div class="input-group justify-content-center pb-2">
                <label class="d-none" for="new-room-name">Room name</label>
                <input class="form-control" id="new-room-name" type="text">
                <button class="btn btn-success" type="submit">Go</button>
            </div>
            <div class="form-check" hidden="">
                <input class="form-check-input" id="private-room-checkbox" type="checkbox" checked="">
                <label class="form-check-label" for="private-room-checkbox">
                    Make room private
                </label>
            </div>
            <div class="form-check" hidden="">
                <input class="form-check-input" id="controlled-room-checkbox" type="checkbox" checked="">
                <label class="form-check-label" for="controlled-room-checkbox">
                    Make room controlled
                </label>
            </div>
        </form>

    </div>



    <script type="module" src="./index.js"></script>



</body></html>
